<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">XPACEBOX logo for dark backgrounds</title>
  <desc id="desc">XPACEBOX horizontal logo with a geometric box symbol and gradient BOX text.</desc>
  <defs>
    <linearGradient id="xpacebox-gradient" x1="12" y1="18" x2="205" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6F32D2"/>
      <stop offset="0.46" stop-color="#E63DAE"/>
      <stop offset="1" stop-color="#FF3B25"/>
    </linearGradient>
    <linearGradient id="xpacebox-text-gradient" x1="412" y1="94" x2="804" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7B35E4"/>
      <stop offset="0.48" stop-color="#E63DAE"/>
      <stop offset="1" stop-color="#FF3B25"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.72 0 1 0 0 0.18 0 0 1 0 0.82 0 0 0 0.42 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <rect x="18" y="18" width="184" height="184" rx="36" fill="url(#xpacebox-gradient)"/>
    <rect x="40" y="40" width="140" height="140" rx="24" fill="#09040D"/>
    <path d="M70 78L110 55L150 78V124L110 147L70 124V78Z" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
    <path d="M70 78L110 101L150 78M110 101V147" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="242" y="113" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="6">XPACE</text>
  <text x="244" y="178" fill="url(#xpacebox-text-gradient)" font-family="Arial Black, Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="6">BOX</text>
</svg>
